<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약사용 - 태그 굽기</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.desc { margin: 0 0 16px; color: #555; }

  /* 기본 = 모바일 세로: 1단, 위아래로 쌓임 */
  .layout { display: block; max-width: 480px; margin: 0 auto; }
  .panel-action { margin-top: 16px; }

  .drug { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #ccc;
          border-radius: 8px; margin-bottom: 8px; }
  .drug input { width: 20px; height: 20px; flex-shrink: 0; }
  .drug img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #f0f0f0; }
  .drug label { flex: 1; }

  #writeBtn { width: 100%; padding: 16px; font-size: 18px;
              background: #2563eb; color: white; border: none; border-radius: 8px; }
  #writeBtn:disabled { background: #9ca3af; }
  #status { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 15px; display: none; }
  #status.ok { background: #dcfce7; color: #166534; display: block; }
  #status.err { background: #fee2e2; color: #991b1b; display: block; }
  #status.info { background: #dbeafe; color: #1e40af; display: block; }
  #preview { font-family: monospace; font-size: 13px; color: #555; margin-top: 8px; word-break: break-all; }

  /* 데스크탑 가로: 2단. 약목록 왼쪽 + 버튼/상태 오른쪽에 고정(sticky) */
  @media (min-width: 800px) {
    .layout {
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 32px;
      align-items: start;
    }
    .panel-action {
      position: sticky;
      top: 16px;
      margin-top: 0;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
    }
  }
</style>
</head>
<body>

<h1>약사용 · 태그 굽기</h1>
<p class="desc">약을 골라 선택 → 태그를 폰 뒤에 대고 [태그에 굽기] 누르세요.</p>

<div class="layout">
  <div id="drugList">불러오는 중...</div>

  <div class="panel-action">
    <button id="writeBtn" disabled>태그에 굽기</button>
    <div id="preview"></div>
    <div id="status"></div>
  </div>
</div>

<script>
// yaktalk-data(medications.json) 스키마 직접 읽음:
// [ { "id":"MED001", "image":"images/MED001.jpg", "content": { "ko": { "name":"...", ... } } } ]
const DATA_BASE = 'https://raw.githubusercontent.com/zzngseo/yaktalk-data/main/';

let drugs = [];
let selected = null;

async function loadDrugs() {
  try {
    const res = await fetch(DATA_BASE + 'medications.json', { cache: 'no-store' });
    const data = await res.json();
    drugs = data.map(d => ({
      code: d.id,
      name: d.content.ko.name,
      image: d.image ? DATA_BASE + d.image : ''
    }));
    renderList();
  } catch (e) {
    document.getElementById('drugList').textContent = 'yaktalk-data에서 medications.json을 못 불러왔습니다: ' + e.message;
  }
}

function renderList() {
  const list = document.getElementById('drugList');
  list.innerHTML = '';
  drugs.forEach(d => {
    const row = document.createElement('div');
    row.className = 'drug';
    row.innerHTML = `
      <input type="radio" name="drug" id="chk-${d.code}" value="${d.code}">
      ${d.image ? `<img src="${d.image}" alt="">` : ''}
      <label for="chk-${d.code}">${d.code} · ${d.name}</label>
    `;
    row.querySelector('input').addEventListener('change', onToggle);
    list.appendChild(row);
  });
}

function onToggle(e) {
  selected = e.target.value;
  updatePreview();
}

function updatePreview() {
  const url = selected ? buildUrl(selected) : '';
  document.getElementById('preview').textContent = url;
  document.getElementById('writeBtn').disabled = !selected;
}

function buildUrl(code) {
  return `https://yaktalk.vercel.app/med/${code}`;
}

document.getElementById('writeBtn').addEventListener('click', async () => {
  const status = document.getElementById('status');
  const code = selected;
  const url = buildUrl(code);

  if (!('NDEFReader' in window)) {
    status.className = 'err';
    status.textContent = 'Web NFC 미지원 브라우저입니다. Chrome(Android)에서 여세요.';
    return;
  }

  try {
    status.className = 'info';
    status.textContent = '태그를 폰 뒤에 대세요...';
    const ndef = new NDEFReader();
    await ndef.write({ records: [{ recordType: 'url', data: url }] });
    status.className = 'ok';
    status.textContent = `굽기 완료: ${code}`;
  } catch (err) {
    status.className = 'err';
    status.textContent = `굽기 실패: ${err.message}`;
  }
});

loadDrugs();
</script>

</body>
</html>
